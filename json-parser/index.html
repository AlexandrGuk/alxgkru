<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON-парсер онлайн — форматирование, валидация и просмотр JSON</title>
    <meta name="description" content="Онлайн-парсер JSON: проверяет и форматирует JSON, показывает его сворачиваемым деревом с подсветкой синтаксиса и убирает лишний текст перед JSON.">
    <link rel="canonical" href="https://alxgk.site/json-parser/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="alxgk.site">
    <meta property="og:title" content="JSON-парсер онлайн — форматирование, валидация и просмотр JSON">
    <meta property="og:description" content="Онлайн-парсер JSON: проверяет и форматирует JSON, показывает его сворачиваемым деревом с подсветкой синтаксиса и убирает лишний текст перед JSON.">
    <meta property="og:url" content="https://alxgk.site/json-parser/">
    <meta property="og:image" content="https://alxgk.site/assets/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/retro.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
        }

        .page {
            padding-top: calc(var(--nav-height) + 12px);
            padding-bottom: 12px;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: var(--window);
            background-image: var(--window-bg);
            box-shadow: var(--window-frame);
        }

        .header {
            padding: 16px 20px;
            border-bottom: 2px solid var(--ink);
        }

        .header p {
            margin-top: 8px;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .main-content {
            display: flex;
            flex: 1;
            min-height: 0;
            position: relative;
        }

        .input-section,
        .output-section {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 200px;
            min-height: 0;
        }

        .resizer {
            width: 12px;
            background: var(--ink);
            cursor: col-resize;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .resizer::before {
            content: '';
            width: 4px;
            height: 40px;
            background: var(--text-muted);
        }

        .resizer:hover::before {
            background: var(--accent-orange);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-bottom: 2px solid var(--ink);
            font-weight: 600;
        }

        .section-content {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 16px;
            background: var(--field);
            color: rgba(255, 255, 255, 0.9);
        }

        #jsonInput {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            resize: none;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            padding: 0;
            background: transparent;
            outline: none;
            color: rgba(255, 255, 255, 0.9);
        }

        #jsonInput::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        #jsonOutput {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: rgba(255, 255, 255, 0.9);
        }

        .json-key {
            color: #667eea;
            font-weight: bold;
        }

        .json-string {
            color: #4ade80;
        }

        .json-number {
            color: #ff8c00;
        }

        .json-boolean {
            color: #f472b6;
            font-weight: bold;
        }

        .json-null {
            color: rgba(255, 255, 255, 0.5);
            font-style: italic;
        }

        .json-bracket {
            color: rgba(255, 255, 255, 0.6);
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .json-bracket:hover {
            background: rgba(255, 140, 0, 0.2);
            border-radius: 3px;
        }

        .collapsible {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-family: inherit;
            font-size: inherit;
            font-weight: bold;
            padding: 0 2px;
            margin: 0;
        }

        .collapsible:hover {
            background: rgba(255, 140, 0, 0.2);
            border-radius: 3px;
            color: #ff8c00;
        }

        .collapsible.collapsed::before {
            content: "▶ ";
        }

        .collapsible.expanded::before {
            content: "▼ ";
        }

        .json-content {
            margin-left: 20px;
            border-left: 1px dashed rgba(255, 140, 0, 0.3);
            padding-left: 10px;
        }

        .json-content.hidden {
            display: none;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
        }

        .controls .btn {
            min-height: 32px;
            padding: 4px 10px;
            font-size: 0.8125rem;
        }

        .error-message {
            color: #f87171;
            background: rgba(248, 113, 113, 0.1);
            border: 2px solid rgba(248, 113, 113, 0.5);
            padding: 15px;
            margin-top: 10px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 13px;
        }

        .status {
            font-size: 12px;
            opacity: 0.7;
            color: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 768px) {
            body,
            .container {
                height: auto;
            }

            .main-content {
                flex-direction: column;
            }

            .input-section,
            .output-section {
                flex: 0 0 60vh !important;
                min-width: auto;
            }

            .resizer {
                width: 100%;
                height: 12px;
                cursor: row-resize;
            }

            .resizer::before {
                width: 40px;
                height: 4px;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .controls {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body class="page layout-wide">
    <nav class="nav">
        <a href="../" class="nav-home">alxgk.site</a>
        <a href="../">Главная</a>
    </nav>
    <div class="container window-open">
        <div class="header">
            <h1 class="page-title">JSON-парсер онлайн</h1>
            <p>Парсер JSON с интерактивным просмотром и подсветкой синтаксиса</p>
        </div>
        
        <div class="main-content">
            <div class="input-section">
                <div class="section-header">
                    <span>Ввод JSON</span>
                    <div class="controls">
                        <button class="btn" onclick="clearInput()">Очистить</button>
                        <button class="btn" onclick="findJSON()" title="Автоматически находит JSON в тексте, удаляя лишние символы в начале">Очистить до JSON</button>
                        <button class="btn btn-primary" onclick="formatJSON()">Форматировать</button>
                        <button class="btn" onclick="parseJSON()">Парсить</button>
                    </div>
                </div>
                <div class="section-content">
                    <textarea id="jsonInput" placeholder="Вставьте сюда ваш JSON..."></textarea>
                </div>
            </div>
            
            <div class="resizer" id="resizer"></div>
            
            <div class="output-section">
                <div class="section-header">
                    <span>Результат</span>
                    <div class="controls">
                        <button class="btn" onclick="expandAll()">Развернуть всё</button>
                        <button class="btn" onclick="collapseAll()">Свернуть всё</button>
                        <span class="status" id="statusText">Готов</span>
                    </div>
                </div>
                <div class="section-content">
                    <div id="jsonOutput" style="color: rgba(255, 255, 255, 0.5);">Здесь появится отформатированный JSON</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let parsedData = null;
        let jsonStructure = null;
        let savedJSON = ''; // Сохраняем JSON в памяти на время сессии

        // Функция для сохранения JSON в памяти
        function saveJSON(jsonString) {
            savedJSON = jsonString;
        }

        // Функция для загрузки JSON из памяти
        function loadJSON() {
            return savedJSON;
        }

        // Функциональность изменения размеров панелей
        let isResizing = false;
        
        function initResizer() {
            const resizer = document.getElementById('resizer');
            const inputSection = document.querySelector('.input-section');
            const outputSection = document.querySelector('.output-section');
            const container = document.querySelector('.main-content');
            
            resizer.addEventListener('mousedown', function(e) {
                e.preventDefault();
                isResizing = true;
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                
                const containerRect = container.getBoundingClientRect();
                const startX = e.clientX;
                const containerWidth = containerRect.width;
                
                function handleMouseMove(e) {
                    if (!isResizing) return;
                    
                    const currentX = e.clientX;
                    const relativeX = currentX - containerRect.left;
                    
                    // Ограничиваем минимальные размеры (200px для каждой панели)
                    const minWidth = 200;
                    const maxLeftWidth = containerWidth - minWidth - 12; // 12px для разделителя
                    
                    let leftWidth = Math.max(minWidth, Math.min(maxLeftWidth, relativeX));
                    let rightWidth = containerWidth - leftWidth - 12;
                    
                    // Применяем новые размеры
                    inputSection.style.flex = `0 0 ${leftWidth}px`;
                    outputSection.style.flex = `0 0 ${rightWidth}px`;
                }
                
                function handleMouseUp() {
                    isResizing = false;
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                    document.removeEventListener('mousemove', handleMouseMove);
                    document.removeEventListener('mouseup', handleMouseUp);
                }
                
                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleMouseUp);
            });
            
            // Сброс размеров при изменении размера окна
            window.addEventListener('resize', function() {
                inputSection.style.flex = '1';
                outputSection.style.flex = '1';
            });
        }

        // Автоматический парсинг при вводе
        document.getElementById('jsonInput').addEventListener('input', function() {
            const value = this.value.trim();
            saveJSON(value); // Сохраняем в памяти при каждом изменении
            if (value) {
                setTimeout(() => parseJSON(), 300);
            }
        });

        function parseJSON() {
            const input = document.getElementById('jsonInput').value.trim();
            const output = document.getElementById('jsonOutput');
            const status = document.getElementById('statusText');
            
            if (!input) {
                output.innerHTML = '<span style="color: rgba(255, 255, 255, 0.5);">Введите JSON для парсинга</span>';
                status.textContent = 'Готов';
                return;
            }
            
            try {
                parsedData = JSON.parse(input);
                jsonStructure = createInteractiveJSON(parsedData);
                output.innerHTML = jsonStructure;
                status.textContent = `Успешно спаршено (${getObjectSize(parsedData)} элементов)`;
                
                // Добавляем обработчики событий для сворачивания/разворачивания
                addCollapsibleEvents();
                
            } catch (error) {
                output.innerHTML = `<div class="error-message">
                    <strong>Ошибка парсинга JSON:</strong><br>
                    ${error.message}
                    <br><br>
                    <strong>Проверьте:</strong><br>
                    • Правильность синтаксиса JSON<br>
                    • Наличие всех закрывающих скобок<br>
                    • Корректность кавычек<br>
                    • Отсутствие лишних запятых
                </div>`;
                status.textContent = 'Ошибка парсинга';
            }
        }

        function createInteractiveJSON(obj, indent = 0) {
            const indentStr = '  '.repeat(indent);
            
            if (obj === null) {
                return `<span class="json-null">null</span>`;
            }
            
            if (typeof obj === 'string') {
                return `<span class="json-string">"${escapeHtml(obj)}"</span>`;
            }
            
            if (typeof obj === 'number') {
                return `<span class="json-number">${obj}</span>`;
            }
            
            if (typeof obj === 'boolean') {
                return `<span class="json-boolean">${obj}</span>`;
            }
            
            if (Array.isArray(obj)) {
                if (obj.length === 0) {
                    return '<span class="json-bracket">[]</span>';
                }
                
                const id = 'array_' + Math.random().toString(36).substr(2, 9);
                let result = `<button class="collapsible expanded" data-target="${id}">[</button>\n`;
                result += `<div class="json-content" id="${id}">`;
                
                obj.forEach((item, index) => {
                    result += `${indentStr}  ${createInteractiveJSON(item, indent + 1)}`;
                    if (index < obj.length - 1) {
                        result += ',';
                    }
                    result += '\n';
                });
                
                result += `</div>${indentStr}<span class="json-bracket">]</span>`;
                return result;
            }
            
            if (typeof obj === 'object') {
                const keys = Object.keys(obj);
                if (keys.length === 0) {
                    return '<span class="json-bracket">{}</span>';
                }
                
                const id = 'object_' + Math.random().toString(36).substr(2, 9);
                let result = `<button class="collapsible expanded" data-target="${id}">{</button>\n`;
                result += `<div class="json-content" id="${id}">`;
                
                keys.forEach((key, index) => {
                    result += `${indentStr}  <span class="json-key">"${escapeHtml(key)}"</span>: `;
                    result += createInteractiveJSON(obj[key], indent + 1);
                    if (index < keys.length - 1) {
                        result += ',';
                    }
                    result += '\n';
                });
                
                result += `</div>${indentStr}<span class="json-bracket">}</span>`;
                return result;
            }
            
            return String(obj);
        }

        function addCollapsibleEvents() {
            document.querySelectorAll('.collapsible').forEach(button => {
                button.addEventListener('click', function() {
                    const targetId = this.getAttribute('data-target');
                    const content = document.getElementById(targetId);
                    
                    if (content.classList.contains('hidden')) {
                        content.classList.remove('hidden');
                        this.classList.remove('collapsed');
                        this.classList.add('expanded');
                    } else {
                        content.classList.add('hidden');
                        this.classList.remove('expanded');
                        this.classList.add('collapsed');
                    }
                });
            });
        }

        function expandAll() {
            document.querySelectorAll('.json-content').forEach(content => {
                content.classList.remove('hidden');
            });
            document.querySelectorAll('.collapsible').forEach(button => {
                button.classList.remove('collapsed');
                button.classList.add('expanded');
            });
        }

        function collapseAll() {
            document.querySelectorAll('.json-content').forEach(content => {
                content.classList.add('hidden');
            });
            document.querySelectorAll('.collapsible').forEach(button => {
                button.classList.remove('expanded');
                button.classList.add('collapsed');
            });
        }

        function formatJSON() {
            const input = document.getElementById('jsonInput');
            try {
                const parsed = JSON.parse(input.value);
                input.value = JSON.stringify(parsed, null, 2);
                parseJSON();
            } catch (error) {
                alert('Невозможно отформатировать: ' + error.message);
            }
        }

        function findJSON() {
            const input = document.getElementById('jsonInput');
            const status = document.getElementById('statusText');
            const originalText = input.value;
            
            if (!originalText || originalText.trim().length === 0) {
                status.textContent = 'Введите текст для поиска JSON';
                return;
            }
            
            status.textContent = 'Поиск JSON...';
            
            const maxCheck = Math.min(1000, originalText.length);
            let found = false;
            let cleanedText = '';
            
            for (let i = 0; i < maxCheck; i++) {
                const testText = originalText.substring(i);
                
                if (testText.trim().length === 0) {
                    break;
                }
                
                try {
                    JSON.parse(testText);
                    cleanedText = testText;
                    found = true;
                    break;
                } catch (e) {
                    continue;
                }
            }
            
            if (found) {
                input.value = cleanedText;
                saveJSON(cleanedText);
                parseJSON();
                status.textContent = 'JSON найден и очищен';
            } else {
                status.textContent = 'Валидный JSON не найден (проверено ' + maxCheck + ' символов)';
            }
        }

        function clearInput() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('jsonOutput').innerHTML = 'Здесь появится отформатированный JSON';
            document.getElementById('statusText').textContent = 'Готов';
            saveJSON(''); // Очищаем сохраненный JSON
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getObjectSize(obj) {
            if (obj === null || typeof obj !== 'object') return 1;
            
            if (Array.isArray(obj)) {
                return obj.reduce((total, item) => total + getObjectSize(item), 0);
            }
            
            return Object.keys(obj).reduce((total, key) => total + getObjectSize(obj[key]), Object.keys(obj).length);
        }

        // Инициализация при загрузке страницы
        window.addEventListener('load', function() {
            document.getElementById('statusText').textContent = 'Готов';
            initResizer(); // Инициализируем функциональность изменения размеров
            
            // Загружаем сохраненный JSON (если есть)
            const savedData = loadJSON();
            if (savedData) {
                document.getElementById('jsonInput').value = savedData;
                parseJSON();
            }
        });
    </script>
</body>
</html>
