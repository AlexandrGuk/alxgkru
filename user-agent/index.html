<body>
    <nav class="nav">
        <a href="../" class="nav-home">alxgk.site</a>
        <a href="../">Главная</a>

    <main class="page">
    <div class="container window-open">
        <div class="header">
            <h1 class="page-title">Мой User Agent</h1>
            <p>Показ и парсинг User Agent</p>
        </div>
        
        <div class="content">
            <div class="results" id="results">
                <div id="parsedResults"></div>
            </div>

            <div class="ua-display">
                <label>Ваш User Agent:</label>
                <div class="ua-text" id="currentUA"></div>
            </div>

            <div class="input-section">
                <label for="customUA">Или введите User Agent для парсинга:</label>
                <textarea id="customUA" placeholder="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36..."></textarea>
                <button class="btn btn-primary" onclick="parseCustomUA()" style="margin-top: 10px;">Парсить</button>
            </div>
        </div>
    </div>
    </main>

    <script>
        function parseUA(uaString) {
            const ua = uaString || navigator.userAgent;
            const result = {
                browser: 'Unknown',
                browserVersion: '',
                os: 'Unknown',
                device: 'Desktop',
                engine: 'Unknown'
            };

            // Browser detection
            if (ua.includes('Edg/')) {
                result.browser = 'Microsoft Edge';
                result.browserVersion = ua.match(/Edg\/([\d.]+)/)?.[1] || '';
            } else if (ua.includes('Chrome/') && !ua.includes('Edg')) {
                result.browser = 'Google Chrome';
                result.browserVersion = ua.match(/Chrome\/([\d.]+)/)?.[1] || '';
            } else if (ua.includes('Firefox/')) {
                result.browser = 'Mozilla Firefox';
                result.browserVersion = ua.match(/Firefox\/([\d.]+)/)?.[1] || '';
            } else if (ua.includes('Safari/') && !ua.includes('Chrome')) {
                result.browser = 'Safari';
                result.browserVersion = ua.match(/Version\/([\d.]+)/)?.[1] || '';
            } else if (ua.includes('Opera/') || ua.includes('OPR/')) {
                result.browser = 'Opera';
                result.browserVersion = ua.match(/(?:Opera|OPR)\/([\d.]+)/)?.[1] || '';
            }

            // OS detection
            if (ua.includes('Windows NT 10.0')) {
                result.os = 'Windows 10/11';
            } else if (ua.includes('Windows NT 6.3')) {
                result.os = 'Windows 8.1';
            } else if (ua.includes('Windows NT 6.2')) {
                result.os = 'Windows 8';
            } else if (ua.includes('Windows NT 6.1')) {
                result.os = 'Windows 7';
            } else if (ua.includes('Mac OS X')) {
                const version = ua.match(/Mac OS X ([\d_]+)/)?.[1];
                result.os = 'macOS' + (version ? ' ' + version.replace(/_/g, '.') : '');
            } else if (ua.includes('Linux')) {
                result.os = 'Linux';
            } else if (ua.includes('Android')) {
                result.os = 'Android';
                const version = ua.match(/Android ([\d.]+)/)?.[1];
                if (version) result.os += ' ' + version;
            } else if (ua.includes('iPhone') || ua.includes('iPad')) {
                result.os = ua.includes('iPad') ? 'iOS (iPad)' : 'iOS (iPhone)';
                const version = ua.match(/OS ([\d_]+)/)?.[1];
                if (version) result.os += ' ' + version.replace(/_/g, '.');
            }

            // Device detection
            if (ua.includes('Mobile') || ua.includes('Android') || ua.includes('iPhone') || ua.includes('iPad')) {
                result.device = 'Mobile';
                if (ua.includes('Tablet') || ua.includes('iPad')) {
                    result.device = 'Tablet';
                }
            }

            // Engine detection
            if (ua.includes('AppleWebKit/')) {
                result.engine = 'WebKit';
            } else if (ua.includes('Gecko/')) {
                result.engine = 'Gecko';
            } else if (ua.includes('Trident/')) {
                result.engine = 'Trident';
            }

            return result;
        }

        function displayResults(parsed) {
            const container = document.getElementById('parsedResults');
            container.innerHTML = `
                <div class="result-item">
                    <div class="result-label">Браузер</div>
                    <div class="result-value">${parsed.browser} ${parsed.browserVersion || ''}</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Операционная система</div>
                    <div class="result-value">${parsed.os}</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Устройство</div>
                    <div class="result-value">${parsed.device}</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Движок</div>
                    <div class="result-value">${parsed.engine}</div>
                </div>
            `;
        }

        function parseCustomUA() {
            const customUA = document.getElementById('customUA').value.trim();
            if (!customUA) {
                alert('Введите User Agent для парсинга');
                return;
            }
            const parsed = parseUA(customUA);
            displayResults(parsed);
        }

        window.addEventListener('load', function() {
            const currentUA = navigator.userAgent;
            document.getElementById('currentUA').textContent = currentUA;
            
            const parsed = parseUA(currentUA);
            displayResults(parsed);

            document.getElementById('customUA').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && e.ctrlKey) {
                    parseCustomUA();
                }
            });
        });
    </script>
</body>
